name: M0 Privacy Gate

on:
  pull_request:
    paths:
      - "web/**"
      - "Dockerfile.m0"
      - ".dockerignore"
      - ".github/workflows/m0-privacy.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.m0"
      - ".dockerignore"
      - ".github/workflows/m0-privacy.yml"

permissions:
  contents: read

jobs:
  privacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Assert validation inputs exist
        run: node scripts/assert-test-presence.mjs
      - name: Targeted M0 privacy regression tests
        run: node --import tsx --test test/m0Privacy.test.ts test/m0Server.test.ts
      - name: Build isolated M0 privacy bundle
        run: VITE_M0_DEMO=1 npm run build
      - name: Audit emitted bundle for egress/cloud code
        run: npm run privacy:bundle
      - name: Reproduce production Docker validation gate
        working-directory: .
        run: docker build --pull=false -f Dockerfile.m0 -t m0-privacy-gate .
      - name: Assert final M0 runtime image is minimal
        working-directory: .
        run: |
          docker run --rm --entrypoint sh m0-privacy-gate -ceu '
            test "$(id -u)" -ne 0
            test -d /app/dist
            test -f /app/scripts/serve-m0.mjs

            for path in \
              /app/docs \
              /app/demo \
              /app/web \
              /app/test \
              /app/bench \
              /app/node_modules \
              /app/package.json \
              /app/package-lock.json \
              /app/.npmrc; do
              test ! -e "$path"
            done

            test -z "$(find /app -type f -name "*.map" -print -quit)"

            top_level="$(find /app -mindepth 1 -maxdepth 1 -printf "%f\n" | sort | tr "\n" " ")"
            test "$top_level" = "dist scripts "

            echo "M0 FINAL RUNTIME IMAGE CONTENTS: PASS"
          '


      - name: Start M0 container for stability gate
        working-directory: .
        run: |
          docker run -d --rm --name m0-stability-gate -p 4173:4173 m0-privacy-gate
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs m0-stability-gate || true
          exit 1

      - name: Install isolated pinned cross-browser harness
        working-directory: .
        run: |
          set -euo pipefail
          PW_DIR="$RUNNER_TEMP/m0-stability-playwright"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          npm init -y >/dev/null
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --ignore-scripts --save-exact playwright@1.63.0
          npm audit --audit-level=high
          ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
          cp "$GITHUB_WORKSPACE/web/test/m0StabilityMatrix.mjs" ./m0StabilityMatrix.mjs

      - name: Cross-browser M0 Stability Gate
        working-directory: .
        env:
          M0_URL: http://127.0.0.1:4173/
          M0_PDF: ${{ github.workspace }}/demo/sample-plan.pdf
        run: node "$RUNNER_TEMP/m0-stability-playwright/m0StabilityMatrix.mjs"

      - name: Stop M0 stability container
        if: always()
        working-directory: .
        run: docker stop m0-stability-gate || true
