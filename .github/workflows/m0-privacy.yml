name: M0 Privacy Gate

on:
  pull_request:
    paths:
      - "web/**"
      - "Dockerfile.m0"
      - ".dockerignore"
      - ".github/workflows/m0-privacy.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.m0"
      - ".dockerignore"
      - ".github/workflows/m0-privacy.yml"

permissions:
  contents: read

jobs:
  privacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Assert validation inputs exist
        run: node scripts/assert-test-presence.mjs
      - name: Targeted M0 privacy regression tests
        run: node --import tsx --test test/m0Privacy.test.ts
      - name: Build isolated M0 privacy bundle
        run: VITE_M0_DEMO=1 npm run build
      - name: Audit emitted bundle for egress/cloud code
        run: npm run privacy:bundle
