name: C5 Identity Delta Recovery

on:
  push:
    branches: [qa/c5-evidence-validation]

permissions:
  contents: read

env:
  BASE_SHA: 392b37abbaf1d622e7c11146cbbcf35a0ddde6b7
  TARGET_SHA: 563f1fc65fdf0faaa1cb357a8be07565180f8e10
  TARGET_REF: refs/pull/1/merge

jobs:
  identity-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_REF"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/c5/base" "$RUNNER_TEMP/c5/target" "$RUNNER_TEMP/c5/compare"
          git show -s --format='%H %P %s' "$TARGET_SHA" | tee "$RUNNER_TEMP/c5/target-merge-proof.txt"

      - name: Checkout accepted base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach --force "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm --prefix web ci
          (cd web && node scripts/fetch-voice-model.mjs)

      - name: Create structured reporter
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/reporter.mjs" <<'EOF'
          function err(e){const x=e?.cause||e;return x?{name:x.name||null,message:x.message||null,code:x.code||null,failureType:x.failureType||null}:null}
          export default async function* reporter(source){for await(const event of source){if(event.type==='test:fail'||event.type==='test:summary'){const d=event.data||{};yield JSON.stringify({type:event.type,file:d.file??null,name:d.name??null,testType:d.details?.type??null,error:err(d.details?.error),counts:d.counts??null})+'\n'}}}
          EOF

      - name: Run accepted-base suite
        shell: bash
        run: |
          set +e
          cd web
          node --import tsx --test --test-reporter="$RUNNER_TEMP/reporter.mjs" --test-reporter-destination="$RUNNER_TEMP/c5/base/events.jsonl" test/*.test.ts
          echo "$?" > "$RUNNER_TEMP/c5/base/exit-code.txt"
          exit 0

      - name: Checkout exact target merge
        shell: bash
        run: |
          set -euo pipefail
          BASE_LOCK="$(git rev-parse "$BASE_SHA:web/package-lock.json")"
          TARGET_LOCK="$(git rev-parse "$TARGET_SHA:web/package-lock.json")"
          git checkout --detach --force "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ "$BASE_LOCK" != "$TARGET_LOCK" ]; then npm --prefix web ci; fi

      - name: Run target suite
        shell: bash
        run: |
          set +e
          cd web
          node --import tsx --test --test-reporter="$RUNNER_TEMP/reporter.mjs" --test-reporter-destination="$RUNNER_TEMP/c5/target/events.jsonl" test/*.test.ts
          echo "$?" > "$RUNNER_TEMP/c5/target/exit-code.txt"
          exit 0

      - name: Calculate exact identity delta
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs=require('fs'),p=require('path'),root=p.join(process.env.RUNNER_TEMP,'c5');
          function load(side){const es=fs.readFileSync(p.join(root,side,'events.jsonl'),'utf8').trim().split(/\n+/).filter(Boolean).map(JSON.parse);const s=es.filter(e=>e.type==='test:summary').at(-1);const f=es.filter(e=>e.type==='test:fail'&&e.testType!=='suite').map(e=>({file:e.file,name:e.name,errorSignature:[e.error?.name,e.error?.code,e.error?.failureType,e.error?.message].filter(Boolean).join(' | ')}));if(!s?.counts)throw Error(side+': missing summary');if(f.length!==s.counts.failed)throw Error(side+': identity count '+f.length+' != '+s.counts.failed);fs.writeFileSync(p.join(root,side,'summary.json'),JSON.stringify(s,null,2));fs.writeFileSync(p.join(root,side,'failures.json'),JSON.stringify(f,null,2));return{s,f}}
          const b=load('base'),t=load('target'),tuple=x=>x.file+'::'+x.name,group=a=>{const m=new Map;for(const x of a){const k=tuple(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return m},bg=group(b.f),tg=group(t.f),all=new Set([...bg.keys(),...tg.keys()]),dup=new Set([...all].filter(k=>(bg.get(k)?.length||0)>1||(tg.get(k)?.length||0)>1)),key=x=>dup.has(tuple(x))?tuple(x)+'::'+(x.errorSignature||'<no-error-signature>'):tuple(x),B=new Set(b.f.map(key)),T=new Set(t.f.map(key)),added=[...T].filter(x=>!B.has(x)).sort(),resolved=[...B].filter(x=>!T.has(x)).sort(),common=[...T].filter(x=>B.has(x)).sort(),r={baseCounts:b.s.counts,targetCounts:t.s.counts,baseFailureIdentityCount:B.size,targetFailureIdentityCount:T.size,commonFailureIdentityCount:common.length,newFailureIdentities:added,resolvedBaselineFailureIdentities:resolved,newWebFailures:added.length};fs.writeFileSync(p.join(root,'compare','report.json'),JSON.stringify(r,null,2));fs.writeFileSync(p.join(root,'compare','NEW_WEB_FAILURES.txt'),String(added.length)+'\n');console.log(JSON.stringify(r,null,2));
          EOF

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-identity-delta-evidence
          path: ${{ runner.temp }}/c5
          if-no-files-found: error
          retention-days: 30

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          value="$(cat "$RUNNER_TEMP/c5/compare/NEW_WEB_FAILURES.txt")"
          echo "NEW_WEB_FAILURES=$value"
          test "$value" = "0"
